plugins {
	id("net.fabricmc.fabric-loom") version "${loom_version}"
}

version = "${version}"
group = "${group}"
base {
	archivesName = "${mod_id}"
}

repositories {
	maven {
		name = "FabricMC"
		url = "https://maven.fabricmc.net"
	}
	mavenCentral()
	maven {
		name = "EssentialisLocal"
		url = uri("maven-local")
	}
}

dependencies {
	minecraft("com.mojang:minecraft:${minecraft_version}")
	implementation("net.fabricmc:fabric-loader:${loader_version}")
	implementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")
	compileOnly("${trinkets_maven_group}:${trinkets_mod_id}:${trinkets_version}")
	compileOnly("${penchant_maven_group}:${penchant_mod_id}:${penchant_version}")
}

def localJar = { group, mod, version ->
	file("maven-local/${group.replace('.', '/')}/${mod}/${version}/${mod}-${version}.jar")
}

def ensureLocalJar = { jar, url, sha512 ->
	jar.parentFile.mkdirs()

	if (!jar.exists()) {
		try {
			new URL(url)
				.withInputStream { input -> jar.withOutputStream { output -> output << input } }
		} catch (Exception e) {
			throw new GradleException("Could not download ${jar.name}. Build once with network access.", e)
		}
	}

	def digest = java.security.MessageDigest.getInstance("SHA-512")
	jar.withInputStream { input ->
		byte[] buffer = new byte[8192]
		int read
		while ((read = input.read(buffer)) != -1) {
			digest.update(buffer, 0, read)
		}
	}

	def actual = digest.digest().encodeHex().toString()
	if (actual != sha512) {
		throw new GradleException("${jar.name} checksum mismatch: " + actual)
	}
}

def trinketsJar = localJar(trinkets_maven_group, trinkets_mod_id, trinkets_version)
def penchantJar = localJar(penchant_maven_group, penchant_mod_id, penchant_version)

if (!trinketsJar.exists()) {
	ensureLocalJar(trinketsJar, trinkets_download_url, trinkets_sha512)
}

if (!penchantJar.exists()) {
	ensureLocalJar(penchantJar, penchant_download_url, penchant_sha512)
}

tasks.register("downloadTrinketsApi") {
	outputs.file(trinketsJar)

	doLast {
		ensureLocalJar(trinketsJar, trinkets_download_url, trinkets_sha512)
	}
}

tasks.register("downloadPenchantApi") {
	outputs.file(penchantJar)

	doLast {
		ensureLocalJar(penchantJar, penchant_download_url, penchant_sha512)
	}
}

tasks.named("compileJava") {
	dependsOn("downloadTrinketsApi", "downloadPenchantApi")
}

processResources {
	filteringCharset = "UTF-8"
	def props = [
			"project_name"   : rootProject.name,
			"mod_id"         : mod_id,
			"mod_name"       : mod_name,
			"mod_description": mod_description,
			"version"        : version,
	]
	inputs.properties(props)
	filesMatching(["fabric.mod.json"]) {
		expand(props)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
	it.options.compilerArgs << "-Xlint:deprecation"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(AbstractArchiveTask).configureEach {
	reproducibleFileOrder = true
	preserveFileTimestamps = false
}

jar {
	exclude(".cache/")
	from(file("LICENSE")) {
		rename("LICENSE", "LICENSE_${mod_id}")
	}
}
